name: myapp-member-green

services:
  member-green-1:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: myapp-member-green-1
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_COLOR: green
      SERVER_NAME: member_green_1
      DISPLAY_SERVER_ADDRESS: myapp-member-green-1
      SERVER_PORT: 8080
      MEMBER_DB_URL: jdbc:mariadb://myapp-mariadb:3306/myapp_member?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      MEMBER_DB_USERNAME: myapp_member_user
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?MEMBER_DB_PASSWORD is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://127.0.0.1:8080}
      OAUTH2_SUCCESS_REDIRECT_URL: ${OAUTH2_SUCCESS_REDIRECT_URL:-http://localhost/cookie}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    expose:
      - "8080"
    networks:
      - myapp-network

  member-green-2:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: myapp-member-green-2
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_COLOR: green
      SERVER_NAME: member_green_2
      DISPLAY_SERVER_ADDRESS: myapp-member-green-2
      SERVER_PORT: 8080
      MEMBER_DB_URL: jdbc:mariadb://myapp-mariadb:3306/myapp_member?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      MEMBER_DB_USERNAME: myapp_member_user
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?MEMBER_DB_PASSWORD is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://127.0.0.1:8080}
      OAUTH2_SUCCESS_REDIRECT_URL: ${OAUTH2_SUCCESS_REDIRECT_URL:-http://localhost/cookie}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    expose:
      - "8080"
    networks:
      - myapp-network

networks:
  myapp-network:
    external: true
    name: myapp-network
