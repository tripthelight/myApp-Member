spring:
  application:
    name: myapp-member

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${MEMBER_DB_URL:jdbc:mariadb://myapp-mariadb:3306/myapp_member?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${MEMBER_DB_USERNAME:myapp_member_user}
    password: ${MEMBER_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID:disabled-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled-google-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost/member/login/oauth2/code/google}
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

            naver:
              client-name: naver
              client-id: ${NAVER_CLIENT_ID:disabled-naver-client-id}
              client-secret: ${NAVER_CLIENT_SECRET:disabled-naver-client-secret}
              redirect-uri: ${NAVER_REDIRECT_URI:http://localhost/member/login/oauth2/code/naver}
              authorization-grant-type: authorization_code
              client-authentication-method: client_secret_post

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  env: ${APP_COLOR:local}
  serverAddress: ${DISPLAY_SERVER_ADDRESS:127.0.0.1}

serverName: ${SERVER_NAME:local_server}

app:
  color: ${APP_COLOR:local}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:ttp://127.0.0.1}
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://127.0.0.1/cookie}

jwt:
  secret: ${JWT_SECRET}