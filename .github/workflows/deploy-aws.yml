name: Deploy Member AWS

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths-ignore:
      - README.md
      - docs/**
      - "**/*.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: myapp-member-aws-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tripthelight/myapp-member

jobs:
  build-publish:
    name: Build and publish Member image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    outputs:
      image-reference: ${{ steps.image.outputs.reference }}

    steps:
      - name: Checkout member repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build member jar
        run: |
          set -Eeuo pipefail

          chmod +x mvnw
          ./mvnw clean package -DskipTests

          echo "Built artifacts:"

          find target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            -print

          JAR_COUNT="$(
            find target \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              | wc -l
          )"

          if [ "$JAR_COUNT" -lt 1 ]; then
            echo "No JAR file was produced." >&2
            exit 1
          fi

      - name: Set image reference
        id: image
        run: |
          set -Eeuo pipefail

          IMAGE_REFERENCE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "reference=${IMAGE_REFERENCE}" \
            >> "$GITHUB_OUTPUT"

          echo "IMAGE_REFERENCE=${IMAGE_REFERENCE}" \
            >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish member image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=myApp-Member
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Member to AWS
    needs:
      - build-publish

    runs-on:
      - self-hosted
      - linux
      - x64
      - myapp-member-prod

    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      INFRA_DIR: /home/ubuntu/myapp/infra/current
      IMAGE_REFERENCE: ${{ needs.build-publish.outputs.image-reference }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

    steps:
      - name: Validate AWS deployment environment
        run: |
          set -Eeuo pipefail

          test "$(whoami)" = "ubuntu"
          test -n "$IMAGE_REFERENCE"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_READ_TOKEN"

          case "$IMAGE_REFERENCE" in
            ghcr.io/tripthelight/myapp-member:*)
              ;;
            *)
              echo "Unexpected image reference: $IMAGE_REFERENCE" >&2
              exit 1
              ;;
          esac

          IMAGE_TAG="${IMAGE_REFERENCE##*:}"

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Image tag must be a full Git commit SHA." >&2
            exit 1
          fi

          test -d "$INFRA_DIR"
          test -f "$INFRA_DIR/scripts/deploy-member.sh"
          test -f "$INFRA_DIR/scripts/deploy-service.sh"
          test -f /etc/myapp/production.env

          CURRENT_BRANCH="$(
            git -C "$INFRA_DIR" branch --show-current
          )"

          if [ "$CURRENT_BRANCH" != "aws-production" ]; then
            echo "Unexpected Infra branch: $CURRENT_BRANCH" >&2
            exit 1
          fi

          if [ -n "$(git -C "$INFRA_DIR" status --short)" ]; then
            git -C "$INFRA_DIR" status --short
            echo "Infra worktree contains changes." >&2
            exit 1
          fi

          docker info >/dev/null

      - name: Verify AWS production Infra synchronization
        run: |
          set -Eeuo pipefail

          git -C "$INFRA_DIR" \
            fetch origin aws-production-infra

          LOCAL_COMMIT="$(
            git -C "$INFRA_DIR" rev-parse HEAD
          )"

          REMOTE_COMMIT="$(
            git -C "$INFRA_DIR" \
              rev-parse origin/aws-production-infra
          )"

          echo "LOCAL_COMMIT=$LOCAL_COMMIT"
          echo "REMOTE_COMMIT=$REMOTE_COMMIT"

          if [ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]; then
            echo "AWS production Infra is not synchronized." >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        run: |
          set -Eeuo pipefail

          DOCKER_CONFIG_DIR="$(
            mktemp -d
          )"

          echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" \
            >> "$GITHUB_ENV"

          printf '%s' "$GHCR_READ_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

      - name: Pull member image
        run: |
          set -Eeuo pipefail

          docker pull "$IMAGE_REFERENCE"

      - name: Deploy member image
        run: |
          set -Eeuo pipefail

          IMAGE_OVERRIDE="$IMAGE_REFERENCE" \
          PRODUCTION_ENV_FILE="/etc/myapp/production.env" \
            bash "$INFRA_DIR/scripts/deploy-member.sh"

      - name: Verify deployed Member containers
        run: |
          set -Eeuo pipefail

          MEMBER_CONTAINER_COUNT="$(
            docker ps \
              --filter 'name=myapp-member-' \
              --format '{{.Names}}' \
              | wc -l
          )"

          if [ "$MEMBER_CONTAINER_COUNT" -lt 1 ]; then
            echo "No running Member container was found." >&2
            exit 1
          fi

          docker ps \
            --filter 'name=myapp-member-' \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

      - name: Clean temporary Docker credentials
        if: always()
        run: |
          set -Eeuo pipefail

          if [ -n "${DOCKER_CONFIG:-}" ] &&
             [ -d "$DOCKER_CONFIG" ]; then
            rm -rf "$DOCKER_CONFIG"
          fi

      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## Member AWS deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE_REFERENCE}\`"
            echo "- Runner: \`beatforever-prod-member\`"
            echo "- Target: AWS production"
            echo "- Result: successful"
          } >> "$GITHUB_STEP_SUMMARY"