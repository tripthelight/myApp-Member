name: Deploy Member AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: myapp-member-aws-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tripthelight/myapp-member

jobs:
  build-publish-deploy:
    name: Build, publish and deploy Member
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout member repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build member jar
        run: |
          set -Eeuo pipefail

          chmod +x mvnw
          ./mvnw clean package -DskipTests

          echo "Built artifacts:"
          find target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            -print

          JAR_COUNT="$(
            find target \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              | wc -l
          )"

          if [ "$JAR_COUNT" -lt 1 ]; then
            echo "No JAR file was produced." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish member image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=myApp-Member
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare secured SSH client
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_HOST_KEY: ${{ secrets.AWS_SSH_HOST_KEY }}
        run: |
          set -Eeuo pipefail

          install -d \
            -m 700 \
            "$HOME/.ssh"

          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/myapp-member-deploy-key"

          printf '%s\n' "$AWS_SSH_HOST_KEY" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 \
            "$HOME/.ssh/myapp-member-deploy-key" \
            "$HOME/.ssh/known_hosts"

          ssh-keygen \
            -y \
            -f "$HOME/.ssh/myapp-member-deploy-key" \
            >/dev/null

          if ! ssh-keygen \
            -F "${{ secrets.AWS_HOST }}" \
            -f "$HOME/.ssh/known_hosts" \
            >/dev/null
          then
            echo "AWS host key entry was not found." >&2
            exit 1
          fi

      - name: Deploy member image to AWS
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_USER: ${{ secrets.AWS_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail

          test -n "$AWS_HOST"
          test -n "$AWS_PORT"
          test -n "$AWS_USER"
          test -n "$GHCR_READ_TOKEN"
          test -n "$IMAGE_REFERENCE"

          printf '%s\n' "$GHCR_READ_TOKEN" |
            ssh \
              -T \
              -i "$HOME/.ssh/myapp-member-deploy-key" \
              -p "$AWS_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              "$AWS_USER@$AWS_HOST" \
              "deploy $IMAGE_REFERENCE"

      - name: Write deployment summary
        if: success()
        env:
          IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          {
            echo "## Member AWS deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE_REFERENCE}\`"
            echo "- Target: AWS production"
            echo "- Result: successful"
          } >> "$GITHUB_STEP_SUMMARY"