name: Deploy Member Local

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: myapp-member-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout member repository
        uses: actions/checkout@v4

      - name: Verify deployment environment
        run: |
          docker version
          docker network inspect myapp-network >/dev/null
          docker inspect myapp-nginx >/dev/null
          test -d /home/um/myApp-Infra
          test -f /home/um/myApp-Infra/scripts/deploy-member.sh
          test -f /home/um/myApp-Infra/scripts/check-app-flow.sh

      - name: Build member jar
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build member Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          docker build -t "myapp-member:${IMAGE_TAG}" .
          docker tag "myapp-member:${IMAGE_TAG}" myapp-member:latest

      - name: Deploy member with new image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          cd /home/um/myApp-Infra
          chmod +x scripts/*.sh
          IMAGE_OVERRIDE="myapp-member:${IMAGE_TAG}" ./scripts/deploy-member.sh

      - name: Run application flow regression check
        run: |
          cd /home/um/myApp-Infra
          git pull --ff-only origin main
          chmod +x scripts/*.sh
          ./scripts/check-app-flow.sh